name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Compile, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Electron needs a display server; GitHub's Linux runners are headless.
      - name: Run integration tests in a virtual display
        run: xvfb-run -a npm run test:integration

  package:
    name: Package VSIX
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Verify package contains public runtime files only
        run: |
          if unzip -Z1 *.vsix | grep -E '(^extension/(AGENTS\.md|HPC Lazy Explorer|VS Code Remote-SSH)|/out/test/|\.map$)'; then
            echo "VSIX contains non-release files."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lazy-workspace-guard-vsix
          path: "*.vsix"
          retention-days: 14
